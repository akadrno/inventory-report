name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_CLIENT_ID: ${{ secrets.VITE_CLIENT_ID }}
          VITE_TENANT_ID: ${{ secrets.VITE_TENANT_ID }}
          VITE_STORAGE_ACCOUNT: ${{ secrets.VITE_STORAGE_ACCOUNT }}
          VITE_TABLE_SAS: ${{ secrets.VITE_TABLE_SAS }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        run: |
          npx --yes @azure/static-web-apps-cli@latest deploy ./dist \
            --deployment-token "${{ secrets.SWA_DEPLOYMENT_TOKEN }}" \
            --env production
